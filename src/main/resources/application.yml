spring:
  application:
    name: cod-manager

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/coddb}
    username: ${SPRING_DATASOURCE_USERNAME:cod}
    password: ${SPRING_DATASOURCE_PASSWORD:cod}

  jpa:
    # Kept open so lazy associations can still be read while the response is
    # being serialised. The purist setting is false, but then every DTO has to
    # be assembled inside the transaction, and a single missed one fails at
    # runtime rather than at compile time.
    open-in-view: true
    hibernate:
      # Flyway owns the schema. Hibernate only validates that the mapping matches.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # Override in production via APP_JWT_SECRET. Must be at least 32 characters
    # for HS256; a shorter value makes the signing key too weak and jjwt rejects it.
    secret: ${APP_JWT_SECRET:change-me-in-production-at-least-32-chars-long}
    ttl: ${APP_JWT_TTL:PT12H}

  carriers:
    yalidine:
      # Point base-url at a mock server in tests; never at production from a laptop.
      base-url: ${YALIDINE_BASE_URL:https://api.yalidine.app/v1}
      api-id: ${YALIDINE_API_ID:missing}
      api-token: ${YALIDINE_API_TOKEN:missing}
      from-wilaya-name: ${YALIDINE_FROM_WILAYA:Constantine}
      timeout: PT10S

  webhooks:
    # Share this with the carrier. Override via APP_WEBHOOKS_SECRET in production.
    secret: ${APP_WEBHOOKS_SECRET:change-me-webhook-secret}

  sync:
    interval: ${APP_SYNC_INTERVAL:PT15M}
    pause-millis: ${APP_SYNC_PAUSE:250}

logging:
  level:
    com.westy.codmanager: DEBUG
