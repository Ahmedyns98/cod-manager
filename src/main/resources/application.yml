spring:
  application:
    name: cod-manager

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/coddb}
    username: ${SPRING_DATASOURCE_USERNAME:cod}
    password: ${SPRING_DATASOURCE_PASSWORD:cod}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only validates that the mapping matches.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # Override in production via APP_JWT_SECRET. Must be at least 32 characters
    # for HS256; a shorter value makes the signing key too weak and jjwt rejects it.
    secret: ${APP_JWT_SECRET:change-me-in-production-at-least-32-chars-long}
    ttl: ${APP_JWT_TTL:PT12H}

logging:
  level:
    com.westy.codmanager: DEBUG
